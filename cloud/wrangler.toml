# Cloudflare Pages project for Aegis.
#
# One project hosts everything:
#   /            → static share page (public/)
#   /v1/*        → encrypted vault sync API  (functions/v1)   [D1-backed]
#   /api/relay/* → one-time PC share relay   (functions/api/relay) [D1-backed]
#
# The `DB` binding (D1) is configured in the Pages dashboard, NOT here:
#   Project → Settings → Bindings → Add → D1 database
#   Variable name: DB    Database: aegis-db
#
# If you deploy with `wrangler pages deploy` (CLI) instead of connecting the
# dashboard build, the binding would be missing — uncomment the [[d1_databases]]
# block at the bottom and paste your database id. Never declare `DB` in both
# places; use exactly one source.
#
# Full walkthrough (dashboard and CLI paths): see README.md.

name = "aegis-cloud"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"

# Uncomment ONLY for CLI deploys (`wrangler pages deploy`) that should carry
# the binding in this file — dashboard-bound projects must leave this off:
# [[d1_databases]]
# binding = "DB"
# database_name = "aegis-db"
# database_id = "PASTE_YOUR_DATABASE_ID_HERE"
